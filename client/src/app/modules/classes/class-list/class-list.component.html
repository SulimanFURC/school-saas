<section class="page">
  <header class="content-area-header sp-page-header" aria-labelledby="classes-page-title">
    <div class="content-area-header__main sp-page-header__main">
      <div class="sp-page-header__icon" aria-hidden="true">
        <i class="bi bi-book-fill"></i>
      </div>
      <div>
        <h1 id="classes-page-title" class="content-area-header__title sp-page-header__title">All Classes</h1>
        <p class="content-area-header__subtitle sp-page-header__subtitle">Grades and sections for your school</p>
      </div>
    </div>
    <div class="content-area-header__end">
      <nav class="content-area-header__crumbs" aria-label="Breadcrumb">
        <a routerLink="/classes" class="content-area-header__crumb content-area-header__crumb--parent">Classes</a>
        <span class="content-area-header__sep" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
        <span class="content-area-header__crumb content-area-header__crumb--current">All Classes</span>
      </nav>
    </div>
  </header>

  <div class="card shadow-sm border-0">
    @if (loading()) {
      <div class="center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    } @else if (rows().length === 0) {
      <p class="empty mb-0">No classes yet. Add a class or complete onboarding.</p>
    } @else {
      <div class="table-responsive">
        <table class="table app-data-table mb-0 align-middle">
          <thead>
            <tr>
              <th scope="col" [attr.aria-sort]="sortAria('name')">
                <button type="button" class="app-data-table__sort-btn" (click)="toggleSort('name')">
                  Name
                  <i class="app-data-table__sort-icon" [class]="sortIconClass('name')" aria-hidden="true"></i>
                </button>
              </th>
              <th scope="col" class="text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            @for (c of pagedRows(); track c.id) {
              <tr>
                <td>{{ c.name }}</td>
                <td class="text-end">
                  <button
                    type="button"
                    class="btn btn-sm btn-danger"
                    aria-label="Delete class"
                    (click)="deleteClass(c, $event)"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
      <app-table-pagination-footer
        [total]="totalCount()"
        [page]="page()"
        [pageSize]="pageSize"
        [totalPages]="totalPages()"
        entryLabel="classes"
        ariaLabel="Classes pagination"
        (pageChange)="setPage($event)"
      />
    }
  </div>
</section>
