<section class="page">
  <header class="content-area-header sp-page-header" aria-labelledby="class-form-page-title">
    <div class="content-area-header__main sp-page-header__main">
      <div class="sp-page-header__icon" aria-hidden="true">
        <i class="bi bi-journal-plus"></i>
      </div>
      <div>
        <h1 id="class-form-page-title" class="content-area-header__title sp-page-header__title">Add Class</h1>
        <p class="content-area-header__subtitle sp-page-header__subtitle">
          Section A is created automatically. Add more sections from class management later.
        </p>
      </div>
    </div>
    <div class="content-area-header__end">
      <nav class="content-area-header__crumbs" aria-label="Breadcrumb">
        <a routerLink="/classes" class="content-area-header__crumb content-area-header__crumb--parent">Classes</a>
        <span class="content-area-header__sep" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
        <span class="content-area-header__crumb content-area-header__crumb--current">Add Class</span>
      </nav>
    </div>
  </header>

  <div class="card shadow-sm border-0">
    <div class="card-body" style="max-width: 520px">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label" for="cf-name">Class name</label>
          <input id="cf-name" class="form-control" formControlName="name" placeholder="e.g. Class 5" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="cf-code">Code (optional)</label>
          <input id="cf-code" class="form-control" formControlName="code" placeholder="e.g. C5" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="cf-order">Display order</label>
          <input id="cf-order" class="form-control" type="number" formControlName="display_order" />
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="submitting">Save</button>
          <a class="btn btn-outline-secondary" routerLink="/classes">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
