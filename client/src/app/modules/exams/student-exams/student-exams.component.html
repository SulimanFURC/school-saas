<p-toast position="top-right"></p-toast>

<section class="student-exams">
  <header class="student-exams__header">
    <h1>My exams</h1>
    <p class="muted">Download admit cards and result cards once available.</p>
  </header>

  <p-table [value]="rows()" [loading]="loading()" [rowHover]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Window</th>
        <th>Status</th>
        <th class="actions">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <a class="title-link" (click)="open(row)">{{ row.title }}</a>
        </td>
        <td>{{ row.exam_type }}</td>
        <td>{{ row.start_date }} → {{ row.end_date }}</td>
        <td>
          <p-tag [value]="row.status" [severity]="statusSeverity(row.status)"></p-tag>
        </td>
        <td class="actions">
          <p-button
            icon="pi pi-id-card"
            label="Admit card"
            text
            [disabled]="!row.can_download_admit_card"
            (onClick)="downloadAdmit(row)"
          ></p-button>
          <p-button
            icon="pi pi-file"
            label="Result"
            text
            severity="success"
            [disabled]="!row.can_view_results"
            (onClick)="downloadResult(row)"
          ></p-button>
          <p-button label="Open" icon="pi pi-arrow-right" text (onClick)="open(row)"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty">No upcoming exams.</td>
      </tr>
    </ng-template>
  </p-table>
</section>
