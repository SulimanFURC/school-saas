<div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
  <div>
    <h1 class="h4 mb-0">Teacher workspace</h1>
    <p class="text-secondary small mb-0">Your assignments and exams</p>
  </div>
  <button type="button" class="btn btn-outline-secondary btn-sm" (click)="refresh()" [disabled]="loading()">
    @if (loading()) {
      <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
    }
    <i class="bi bi-arrow-clockwise"></i>
    <span class="ms-1">Refresh</span>
  </button>
</div>

@if (loading() && !data()) {
  <div class="placeholder-glow row g-3">
    @for (i of [1, 2, 3]; track i) {
      <div class="col-md-4"><div class="card"><div class="card-body"><span class="placeholder col-12"></span></div></div></div>
    }
  </div>
}

@if (data(); as d) {
  <app-dashboard-section title="Summary">
    <div class="row g-3 mb-2">
      <div class="col-md-4">
        <app-stat-card label="My classes" [value]="d.my_assignments.length" icon="bi-collection" routerLink="/teachers/me" />
      </div>
      <div class="col-md-4">
        <app-stat-card label="Upcoming exams" [value]="d.my_exams.upcoming" icon="bi-calendar-event" routerLink="/teachers/exams" />
      </div>
      <div class="col-md-4">
        <app-stat-card
          label="Marks pending"
          [value]="d.my_exams.marks_pending"
          icon="bi-pencil-square"
          [variant]="d.my_exams.marks_pending > 0 ? 'warning' : 'default'"
        />
      </div>
    </div>
  </app-dashboard-section>

  <app-dashboard-section title="Teaching assignments">
    <app-recent-table title="" [columns]="assignmentColumns" [rows]="assignmentRows()" />
  </app-dashboard-section>

  <app-dashboard-section title="Notifications">
    <app-recent-table title="" [columns]="notifColumns" [rows]="notifRows()" />
  </app-dashboard-section>
}
