<p-toast position="top-right" />
<p-confirmdialog />

<section class="page">
  <header class="content-area-header sp-page-header" aria-labelledby="subjects-page-title">
    <div class="content-area-header__main sp-page-header__main">
      <div class="sp-page-header__icon" aria-hidden="true">
        <i class="bi bi-journals"></i>
      </div>
      <div>
        <h1 id="subjects-page-title" class="content-area-header__title sp-page-header__title">Subjects</h1>
        <p class="content-area-header__subtitle sp-page-header__subtitle">Manage the subject master list</p>
      </div>
    </div>
    <div class="content-area-header__end d-flex flex-wrap align-items-center justify-content-end gap-2">
      <p-button label="Add subject" icon="pi pi-plus" (onClick)="openCreate()" />
    </div>
  </header>

  <div class="card shadow-sm border-0">
    <p-table
      [value]="pagedRows()"
      [loading]="loading()"
      dataKey="id"
      styleClass="p-datatable-sm p-datatable-striped"
      responsiveLayout="scroll"
      emptyMessage="No subjects yet."
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Status</th>
          <th class="text-end">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td class="fw-semibold">{{ row.name }}</td>
          <td>
            <p-tag [value]="row.is_active ? 'Active' : 'Inactive'" [severity]="statusSeverity(row)" />
          </td>
          <td class="text-end text-nowrap">
            <p-button
              type="button"
              icon="pi pi-pencil"
              severity="secondary"
              [text]="true"
              ariaLabel="Edit subject"
              (onClick)="openEdit(row)"
            />
            <p-button
              type="button"
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              ariaLabel="Delete subject"
              (onClick)="remove(row)"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
    <app-table-pagination-footer
      [total]="total()"
      [page]="page()"
      [pageSize]="pageSize()"
      [totalPages]="totalPages()"
      entryLabel="subjects"
      (pageChange)="onPageChange($event)"
    />
  </div>
</section>

<p-dialog
  [header]="editId() ? 'Edit subject' : 'Add subject'"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(520px, 96vw)' }"
  (onHide)="closeDialog()"
>
  <div class="d-flex flex-column gap-3">
    <div>
      <label class="form-label fw-medium">Name</label>
      <input
        pInputText
        type="text"
        class="w-100"
        [ngModel]="nameInput()"
        (ngModelChange)="nameInput.set($event)"
        maxlength="100"
        placeholder="e.g. Physics"
        autocomplete="off"
      />
    </div>

    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        id="subject-active"
        [checked]="isActiveInput()"
        (change)="isActiveInput.set(($any($event.target)).checked)"
      />
      <label class="form-check-label" for="subject-active">Active</label>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="d-flex justify-content-end gap-2">
      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        (onClick)="closeDialog()"
      />
      <p-button
        type="button"
        label="Save"
        icon="pi pi-check"
        [loading]="submitting()"
        [disabled]="submitting()"
        (onClick)="save()"
      />
    </div>
  </ng-template>
</p-dialog>
