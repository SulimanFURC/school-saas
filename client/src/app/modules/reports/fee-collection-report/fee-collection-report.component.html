<div class="card shadow-sm">
  <div class="card-body">
    <h2 class="h6 mb-3">Fee collection summary</h2>
    <form class="row g-2 align-items-end mb-3" [formGroup]="form" (ngSubmit)="apply()">
      <div class="col-md-4">
        <label class="form-label" for="fc-from">From</label>
        <input id="fc-from" class="w-100" pInputText type="date" formControlName="date_from" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="fc-to">To</label>
        <input id="fc-to" class="w-100" pInputText type="date" formControlName="date_to" />
      </div>
      <div class="col-md-4">
        <p-button type="submit" label="Apply" styleClass="w-100" [loading]="loading()" [disabled]="loading()" />
      </div>
    </form>

    @if (loading()) {
      <app-skeleton-table [rows]="4" [columns]="2" />
    } @else {
      @if (hasError()) {
        <app-inline-error message="Failed to load fee collection report. Please try again." (retry)="apply()" />
      } @else {
        @if (result(); as r) {
          <p><strong>Total:</strong> {{ r.total_collected }}</p>
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Method</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody>
              @for (row of r.by_payment_mode; track row.mode) {
                <tr>
                  <td>{{ row.mode }}</td>
                  <td>{{ row.total }}</td>
                </tr>
              }
            </tbody>
          </table>
        }
      }
    }
  </div>
</div>
