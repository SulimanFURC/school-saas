<div class="card shadow-sm">
  <div class="card-body">
    <h2 class="h6 mb-3">Enrollment summary</h2>
    <form class="row g-2 align-items-end mb-3" [formGroup]="form" (ngSubmit)="apply()">
      <div class="col-md-6">
        <label class="form-label" for="enr-ay">Academic year</label>
        <p-select
          inputId="enr-ay"
          class="w-100"
          [options]="yearOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="Select academic year"
          formControlName="academic_year_id"
        />
      </div>
      <div class="col-md-6 d-flex gap-2">
        <p-button type="submit" label="Apply" [loading]="loading()" [disabled]="loading()" />
        <p-button
          type="button"
          label="Export CSV"
          [outlined]="true"
          (onClick)="exportCsv()"
          [disabled]="!summary()?.by_gender?.length"
        />
      </div>
    </form>

    @if (loading()) {
      <app-skeleton-table [rows]="4" [columns]="2" />
    } @else {
      @if (hasError()) {
        <app-inline-error message="Failed to load enrollment report. Please try again." (retry)="apply()" />
      } @else {
        @if (summary(); as s) {
          <p class="mb-2"><strong>Total enrolled:</strong> {{ s.total_enrolled }}</p>
          <div class="table-responsive">
            <table class="table table-sm table-striped">
              <thead>
                <tr>
                  <th>Gender</th>
                  <th>Count</th>
                </tr>
              </thead>
              <tbody>
                @for (r of s.by_gender; track r.gender) {
                  <tr>
                    <td>{{ r.gender }}</td>
                    <td>{{ r.count }}</td>
                  </tr>
                } @empty {
                  <tr>
                    <td colspan="2" class="text-secondary">No rows</td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        }
      }
    }
  </div>
</div>
