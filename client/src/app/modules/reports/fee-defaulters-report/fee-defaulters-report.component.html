<div class="card shadow-sm">
  <div class="card-body">
    <h2 class="h6 mb-3">Fee defaulters (no payment this calendar year)</h2>
    <form class="row g-2 align-items-end mb-3" [formGroup]="form" (ngSubmit)="apply()">
      <div class="col-md-8">
        <label class="form-label" for="fd-ay">Academic year</label>
        <p-select
          inputId="fd-ay"
          class="w-100"
          [options]="yearOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="Select academic year"
          formControlName="academic_year_id"
        />
      </div>
      <div class="col-md-4">
        <p-button type="submit" label="Apply" styleClass="w-100" [loading]="loading()" [disabled]="loading()" />
      </div>
    </form>
    <div class="table-responsive">
      @if (loading()) {
        <app-skeleton-table [rows]="6" [columns]="3" />
      } @else if (hasError()) {
        <app-inline-error message="Failed to load fee defaulters report. Please try again." (retry)="apply()" />
      } @else {
        <table class="table table-sm table-striped">
          <thead>
            <tr>
              <th>Admission</th>
              <th>Name</th>
              <th>Last payment</th>
            </tr>
          </thead>
          <tbody>
            @for (r of rows(); track r.student_id) {
              <tr>
                <td>{{ r.admission_no }}</td>
                <td>{{ r.student_name }}</td>
                <td>{{ r.last_payment_date ?? '—' }}</td>
              </tr>
            } @empty {
              <tr>
                <td colspan="3" class="text-secondary">No rows — run Apply</td>
              </tr>
            }
          </tbody>
        </table>
      }
    </div>
  </div>
</div>
