<div class="card shadow-sm">
  <div class="card-body">
    <h2 class="h6 mb-3">Change password</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label" for="cp-cur">Current password</label>
        <input id="cp-cur" class="form-control" type="password" autocomplete="current-password" formControlName="currentPassword" />
      </div>
      <div class="mb-3">
        <label class="form-label" for="cp-new">New password</label>
        <input id="cp-new" class="form-control" type="password" autocomplete="new-password" formControlName="newPassword" />
      </div>
      <div class="mb-3">
        <label class="form-label" for="cp-conf">Confirm new password</label>
        <input id="cp-conf" class="form-control" type="password" autocomplete="new-password" formControlName="confirmPassword" />
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
        }
        Update password
      </button>
    </form>
  </div>
</div>
