<section class="page">
  <header class="content-area-header sp-page-header" aria-labelledby="settings-password-title">
    <div class="content-area-header__main sp-page-header__main">
      <div class="sp-page-header__icon" aria-hidden="true">
        <i class="bi bi-shield-lock"></i>
      </div>
      <div>
        <h1 id="settings-password-title" class="content-area-header__title sp-page-header__title">Password</h1>
        <p class="content-area-header__subtitle sp-page-header__subtitle">
          Keep your account secure by rotating your password regularly.
        </p>
      </div>
    </div>
  </header>

  <div class="card shadow-sm">
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <app-form-section title="Change password" description="Set a new password for your current account.">
        <div class="mb-3">
          <label class="form-label" for="cp-cur">Current password</label>
          <input
            id="cp-cur"
            class="form-control"
            type="password"
            autocomplete="current-password"
            formControlName="currentPassword"
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="cp-new">New password</label>
          <input
            id="cp-new"
            class="form-control"
            type="password"
            autocomplete="new-password"
            formControlName="newPassword"
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="cp-conf">Confirm new password</label>
          <input
            id="cp-conf"
            class="form-control"
            type="password"
            autocomplete="new-password"
            formControlName="confirmPassword"
          />
        </div>
        </app-form-section>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          @if (saving()) {
            <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
          }
          Update password
        </button>
      </form>
    </div>
  </div>
</section>
