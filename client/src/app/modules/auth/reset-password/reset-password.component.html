<div class="auth-simple container py-5">
  <div class="mx-auto" style="max-width: 420px">
    <h1 class="h4 mb-3">Set a new password</h1>
    <p class="text-muted small mb-4">Use the reset token from your administrator or the dev response from forgot-password.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" class="d-grid gap-3">
      <div>
        <label class="form-label" for="rp-sub">School subdomain</label>
        <input id="rp-sub" class="form-control" type="text" formControlName="subdomain" autocomplete="organization" />
      </div>
      <div>
        <label class="form-label" for="rp-token">Reset token</label>
        <input id="rp-token" class="form-control" type="text" formControlName="token" autocomplete="one-time-code" />
      </div>
      <div>
        <label class="form-label" for="rp-pass">New password</label>
        <input
          id="rp-pass"
          class="form-control"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
        />
      </div>
      <div>
        <label class="form-label" for="rp-pass2">Confirm password</label>
        <input
          id="rp-pass2"
          class="form-control"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        @if (form.touched && form.hasError('passwordsMismatch')) {
          <div class="invalid-feedback d-block">Passwords do not match</div>
        }
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="submitting">
        {{ submitting ? 'Saving…' : 'Update password' }}
      </button>
    </form>
    <p class="mt-4 small mb-0">
      <a routerLink="/login">Back to sign in</a>
    </p>
  </div>
</div>
