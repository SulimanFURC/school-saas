<div class="ds-form-shell position-relative">
  @if (loading()) {
    <div
      class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-body rounded z-2"
      style="--bs-bg-opacity: 0.85"
    >
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }
  <ng-content />
</div>
