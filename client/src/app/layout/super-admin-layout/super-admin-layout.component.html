@if (isMobile() && sidebarOpen()) {
  <div class="layout-backdrop" aria-hidden="true" (click)="sidebarOpen.set(false)"></div>
}

<div class="layout-shell sa-layout">
  <aside
    id="app-sa-sidebar"
    class="layout-sidebar sa-sidenav border-end"
    [class.layout-sidebar--open]="sidebarOpen()"
  >
    <div class="layout-sidebar__inner">
      <div class="sa-brand border-bottom">
        <div class="sa-brand__row">
          <img class="sa-brand__logo" src="assets/default-logo.png" width="40" height="40" alt="" />
          <div class="sa-brand__text">
            <span class="ds-headline-sm sa-brand__title">Platform</span>
            <span class="ds-label-sm sa-brand__subtitle">Super admin</span>
          </div>
        </div>
      </div>

      <nav class="d-flex flex-column gap-1 px-2 pb-3 pt-3 layout-sidenav-inner flex-grow-1">
        <a
          class="sa-nav-item"
          routerLink="/super-admin/tenants"
          routerLinkActive="sa-nav-item--active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeSidebarIfMobile()"
        >
          <i class="bi bi-building"></i>
          <span class="ds-body-sm">Tenants</span>
        </a>
        <a
          class="sa-nav-item"
          routerLink="/super-admin/settings"
          routerLinkActive="sa-nav-item--active"
          (click)="closeSidebarIfMobile()"
        >
          <i class="bi bi-gear"></i>
          <span class="ds-body-sm">Settings</span>
        </a>
        <a class="sa-nav-item" routerLink="/" (click)="closeSidebarIfMobile()">
          <i class="bi bi-arrow-left"></i>
          <span class="ds-body-sm">School app</span>
        </a>
      </nav>
    </div>
  </aside>

  <div class="layout-main sa-main d-flex flex-column min-vh-100 flex-grow-1">
    <header class="sa-toolbar navbar border-bottom layout-toolbar">
      <div class="container-fluid px-2 py-0 d-flex align-items-center">
        <button
          type="button"
          class="btn btn-link p-2 me-1"
          [attr.aria-expanded]="sidebarOpen()"
          aria-controls="app-sa-sidebar"
          aria-label="Toggle navigation"
          (click)="toggleSidebar()"
        >
          <i class="bi bi-list fs-4"></i>
        </button>
        <h1 class="ds-headline-sm sa-toolbar__title mb-0">{{ pageTitle() }}</h1>
        <span class="sa-toolbar__spacer flex-grow-1"></span>
        <app-header-actions />
      </div>
    </header>
    <main class="sa-content flex-grow-1">
      <router-outlet />
    </main>
  </div>
</div>
