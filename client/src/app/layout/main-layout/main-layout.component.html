@if (isMobile() && sidebarOpen()) {
  <div class="layout-backdrop" aria-hidden="true" (click)="sidebarOpen.set(false)"></div>
}

<div class="layout-shell">
  <aside
    id="app-main-sidebar"
    class="layout-sidebar border-end"
    [class.layout-sidebar--open]="sidebarOpen()"
  >
    <div class="layout-sidebar__inner">
      <div class="layout-brand border-bottom">
        <div class="layout-brand__row">
          <img class="layout-brand__logo" [src]="tenantLogoSrc()" width="40" height="40" alt="" />
          <div class="layout-brand__text">
            <span class="ds-headline-sm layout-brand__title">School SaaS</span>
            <span class="ds-label-sm layout-brand__subtitle">Admin workspace</span>
          </div>
        </div>
      </div>

      <nav class="d-flex flex-column gap-1 px-2 pb-3 pt-3 layout-sidenav-inner flex-grow-1">
        @for (item of navItems(); track item.path) {
          <a
            class="layout-nav-item"
            [routerLink]="item.path"
            routerLinkActive="layout-nav-item--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            (click)="closeSidebarIfMobile()"
          >
            <i class="bi" [ngClass]="navIconClass(item.icon)"></i>
            <span class="ds-body-sm">{{ item.label }}</span>
          </a>
        }
      </nav>
    </div>
  </aside>

  <div class="layout-main d-flex flex-column min-vh-100 flex-grow-1">
    <header class="layout-toolbar navbar border-bottom layout-toolbar">
      <div class="container-fluid px-2 py-0 d-flex align-items-center">
        <button
          type="button"
          class="btn btn-link layout-toolbar__menu p-2 me-1"
          [attr.aria-expanded]="sidebarOpen()"
          aria-controls="app-main-sidebar"
          aria-label="Toggle navigation"
          (click)="toggleSidebar()"
        >
          <i class="bi bi-list fs-4"></i>
        </button>
        <h1 class="ds-headline-sm layout-toolbar__title mb-0">{{ pageTitle() }}</h1>
        <span class="layout-toolbar__spacer flex-grow-1"></span>
        @if (auth.userRole() === 'super_admin') {
          <a class="btn btn-link layout-toolbar__link me-1" routerLink="/super-admin/tenants"> Super admin </a>
        }
        <app-header-actions />
      </div>
    </header>

    <main class="layout-content flex-grow-1">
      <router-outlet />
    </main>
  </div>
</div>
