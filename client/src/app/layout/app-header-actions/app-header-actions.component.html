<div class="app-header-actions d-flex align-items-center gap-1 flex-shrink-0">
  <p-button
    [icon]="isDark() ? 'bi bi-sun' : 'bi bi-moon'"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    styleClass="app-header-actions__icon p-2"
    (onClick)="toggleTheme()"
    [pTooltip]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    tooltipPosition="bottom"
    [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
  />

  <div class="dropdown">
    <button
      type="button"
      class="btn btn-link app-header-actions__icon p-2 position-relative"
      data-bs-toggle="dropdown"
      aria-expanded="false"
      aria-label="Notifications"
    >
      <i class="bi bi-bell"></i>
      @if (unreadCount() > 0) {
        <span class="badge rounded-pill bg-danger app-header-actions__notif-badge">
          {{ unreadCount() }}
        </span>
      }
    </button>
    <div class="dropdown-menu dropdown-menu-end p-0 app-notif-menu shadow">
      <div class="app-notif-menu__header">
        <span class="app-notif-menu__title">Notifications</span>
        @if (unreadCount() > 0) {
          <button type="button" class="btn btn-link btn-sm app-notif-menu__mark-all p-0" (click)="markAllNotificationsRead()">
            Mark all read
          </button>
        }
      </div>
      <div class="list-group list-group-flush" style="max-height: 360px; overflow-y: auto">
        @for (n of notifications(); track n.id) {
          <button
            type="button"
            class="list-group-item list-group-item-action border-0 rounded-0 app-notif-menu__item text-start"
            [class.app-notif-menu__item--unread]="!n.read"
            (click)="markNotifRead(n)"
          >
            <div class="app-notif-menu__row">
              <span class="app-notif-menu__item-title">{{ n.title }}</span>
              @if (!n.read) {
                <span class="app-notif-menu__dot" aria-hidden="true"></span>
              }
            </div>
            <span class="app-notif-menu__item-body">{{ n.body }}</span>
            <span class="app-notif-menu__item-time">{{ relativeTime(n.createdAt) }}</span>
          </button>
        }
      </div>
    </div>
  </div>

  <div class="dropdown">
    <button
      type="button"
      class="btn btn-link app-header-actions__user d-flex align-items-center gap-2 text-decoration-none"
      data-bs-toggle="dropdown"
      aria-expanded="false"
      [attr.aria-label]="'Account menu for ' + displayName()"
    >
      <span class="app-header-actions__avatar" aria-hidden="true">{{ avatarInitials() }}</span>
      <span class="app-header-actions__user-text">
        <span class="app-header-actions__name">{{ displayName() }}</span>
        <span class="app-header-actions__role">{{ displayRole() }}</span>
      </span>
      <i class="bi bi-chevron-down app-header-actions__chevron"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end p-0 app-account-menu">
      <li class="list-unstyled" role="presentation">
        <div class="app-account-menu__header">
          <div class="app-account-menu__avatar-wrap">
            <span class="app-account-menu__avatar" aria-hidden="true">{{ avatarInitials() }}</span>
            <span class="app-account-menu__online" aria-hidden="true"></span>
          </div>
          <div class="app-account-menu__identity">
            <span class="app-account-menu__name">{{ displayName() }}</span>
            <span class="app-account-menu__secondary">{{ displayRole() }}</span>
          </div>
        </div>
      </li>
      <li><hr class="dropdown-divider app-account-menu__divider" role="presentation" /></li>
      <li>
        <a class="dropdown-item" routerLink="/profile">
          <i class="bi bi-person me-2"></i>
          My Profile
        </a>
      </li>
      <li>
        <a class="dropdown-item" routerLink="/settings">
          <i class="bi bi-gear me-2"></i>
          Account settings
        </a>
      </li>
      <li><hr class="dropdown-divider app-account-menu__divider" role="presentation" /></li>
      <li>
        <button type="button" class="dropdown-item" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>
          Log out
        </button>
      </li>
    </ul>
  </div>
</div>
